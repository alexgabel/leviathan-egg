[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leviathan-egg"
version = "0.1.0"
description = "leviathan-egg"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alex", family-name = "Gabel"}]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6"
]

[project.scripts]
leviathan-egg = "leviathan_egg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
